[build]
  command = "npm run build --workspace web"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "20"

# Legacy editor's Flask backend is not part of this static deploy → return 404
# (instead of the SPA HTML) so API calls fail clearly.
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 404

# SPA fallback for client-side routing (react-router).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
